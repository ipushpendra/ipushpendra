name: Update Profile README

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  workflow_dispatch:  # Allows manual execution

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Repositories (User + Orgs)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Fetching repositories..."
          
          # GraphQL Query for Personal + Org Repos
          QUERY='{
            "query": "query {
              viewer {
                repositories(first: 5, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes { name url }
                }
                organizations(first: 5) {
                  nodes {
                    name
                    repositories(first: 5, orderBy: {field: UPDATED_AT, direction: DESC}) {
                      nodes { name url }
                    }
                  }
                }
              }
            }"
          }'

          # Fetch Data
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                          -H "Content-Type: application/json" \
                          -X POST -d "$QUERY" https://api.github.com/graphql)

          # Extract Personal Repos
          echo "## 📌 Latest Repositories" > latest-repos.md
          echo "" >> latest-repos.md
          echo "$RESPONSE" | jq -r '.data.viewer.repositories.nodes[] | "- [\(.name)](\(.url))"' >> latest-repos.md

          # Extract Organization Repos
          echo "$RESPONSE" | jq -r '.data.viewer.organizations.nodes[] | .repositories.nodes[] | "- [\(.name)](\(.url))"' >> latest-repos.md

      - name: Update README.md
        run: |
          sed -i '/<!-- LATEST_REPOS -->/r latest-repos.md' README.md
          rm latest-repos.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📌 Update latest repositories" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

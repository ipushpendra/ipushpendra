name: Update Profile README

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  workflow_dispatch:  # Allows manual execution

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Fetching repositories..."
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -X POST -d '{"query": "query { viewer { repositories(first: 5, orderBy: {field: UPDATED_AT, direction: DESC}) { nodes { name url } } } }"}' https://api.github.com/graphql)
          echo "$RESPONSE" | jq -r '.data.viewer.repositories.nodes[] | "- [\(.name)](\(.url))"' > latest-repos.md

      - name: Generate GitHub Stats
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          echo "### 📊 GitHub Stats  " > github-stats.md
          echo "![GitHub Stats](https://github-readme-stats.vercel.app/api?username=$GITHUB_USERNAME&show_icons=true&theme=radical&count_private=true)  " >> github-stats.md          

      - name: Update README.md
        run: |
          # Replace LATEST_REPOS section
          sed -i '/<!-- LATEST_REPOS_START -->/,/<!-- LATEST_REPOS_END -->/c\<!-- LATEST_REPOS_START -->\n'"$(cat latest-repos.md)"'\n<!-- LATEST_REPOS_END -->' README.md
          
          # Replace GITHUB_STATS section
          sed -i '/<!-- GITHUB_STATS_START -->/,/<!-- GITHUB_STATS_END -->/c\<!-- GITHUB_STATS_START -->\n'"$(cat github-stats.md)"'\n<!-- GITHUB_STATS_END -->' README.md
          
          # Cleanup
          rm latest-repos.md github-stats.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📌 Auto-update README with latest repositories and stats" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

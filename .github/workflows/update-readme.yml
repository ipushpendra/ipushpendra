name: Update Profile README

on:
  schedule:
    - cron: "0 * * * *"  # Runs every hour
  workflow_dispatch:  # Allows manual execution

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Latest Repositories (User + Orgs)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Fetching repositories..."
          
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -X POST -d '{"query": "query { viewer { repositories(first: 5, orderBy: {field: UPDATED_AT, direction: DESC}) { nodes { name url } } organizations(first: 5) { nodes { name repositories(first: 5, orderBy: {field: UPDATED_AT, direction: DESC}) { nodes { name url } } } } } }"}' https://api.github.com/graphql)

          echo "$RESPONSE" | jq -r '.data.viewer.repositories.nodes[] | "- [\(.name)](\(.url))"' > latest-repos.md
          echo "$RESPONSE" | jq -r '.data.viewer.organizations.nodes[] | .repositories.nodes[] | "- [\(.name)](\(.url))"' >> latest-repos.md

      - name: Generate Fancy GitHub Stats Section
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          echo "**📊 GitHub Stats**  " > github-stats.md
          echo "![GitHub Stats](https://github-readme-stats.vercel.app/api?username=$GITHUB_USERNAME&show_icons=true&theme=radical&count_private=true)  " >> github-stats.md
          echo "![Top Languages](https://github-readme-stats.vercel.app/api/top-langs/?username=$GITHUB_USERNAME&layout=compact&theme=radical)  " >> github-stats.md
          echo "![GitHub Streak](https://github-readme-streak-stats.herokuapp.com/?user=$GITHUB_USERNAME&theme=radical)  " >> github-stats.md

      - name: Update README.md
        run: |
          sed -i '/<!-- LATEST_REPOS -->/r latest-repos.md' README.md
          sed -i '/<!-- GITHUB_STATS -->/r github-stats.md' README.md
          rm latest-repos.md github-stats.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "📌 Update latest repositories & GitHub stats" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
